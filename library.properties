paragraph=Arduino and ESP-IDF CSI computer-vision library by Rakib Hasan (@thezerohz). MIPI CSI cameras (OV5647/IMX708), PSRAM multi-frame capture, hardware JPEG, PPA scale/rotate, motion DSP, CameraWebServer-style WiFi MJPEG UI, ESP-WHO-style async pipeline, and ESP-DL face detect under ESP-IDF. Named for CSI vision — not locked to one SoC (ESP32-P4 today). Requires PSRAM on supported boards.
