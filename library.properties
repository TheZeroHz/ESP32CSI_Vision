paragraph=Arduino and ESP-IDF CSI computer-vision library by Rakib Hasan (@thezerohz). MIPI CSI cameras (OV5647/IMX708), PSRAM multi-frame capture, hardware JPEG, bundled ESP32-P4 HW H.264 (esp_h264), PPA scale/rotate, motion DSP, CameraWebServer-style MJPEG UI, bundled WebFileManager (SD explorer), ESP-WHO-style async pipeline, and ESP-DL face detect under ESP-IDF. Requires PSRAM on supported boards.
